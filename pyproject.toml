[project]
name = "silent-rag"
version = "0.1.0"
description = "Benchmark for label-free detection of retrieval degradation in RAG"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "sentence-transformers",
    "faiss-cpu",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "duckdb",
    "pyarrow",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "nbstripout"]
judge = ["anthropic"]  # the LLM judge (#26); nothing else calls an API

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: real models end to end, minutes; excluded by default, run with pytest -m slow"]
addopts = "-m 'not slow'"
