# Held-out evaluation (#29). Needs --final:
#   python -m silent_rag.run --config configs/final.yaml --final
# Model and doc length from #5, window size from #4; keep the retriever block identical to dev.yaml.
datasets: [scifact, fiqa]
model: sentence-transformers/multi-qa-MiniLM-L6-cos-v1
retriever:
  revision: b207367332321f8e44f96e224ef15bc607f4dbf0
  max_seq_length: 256  # title + text truncated at 256 tokens, no chunking (#5)
failures:
  F1_partial_upgrade_minilm:
    injector: F1_partial_upgrade
    severities: [0.1, 0.3, 0.5, 0.7, 0.9]
    alt_model: sentence-transformers/all-MiniLM-L6-v2
    alt_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  F1_partial_upgrade_bge:
    injector: F1_partial_upgrade
    severities: [0.1, 0.3, 0.5, 0.7, 0.9]
    alt_model: BAAI/bge-small-en-v1.5
    alt_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  # F2 on FiQA can add at most 8,674 ArguAna docs, 15% of its corpus (#89 refuses more),
  # and one grid has to fit both datasets, so F2 runs below 0.15 here.
  F2_distractors_arguana:
    injector: F2_distractors
    severities: [0.05, 0.1, 0.15]
    source: arguana
  # negative controls (#9, #15, #72), as in dev_full.yaml. Mixed truncation re-embeds the
  # corpus at 512 tokens: about 42 min for FiQA on one thread (timed on NFCorpus docs at
  # 23 docs/s, which are longer than FiQA posts, so an upper bound), once per run.
  H_mixed_truncation_512:
    injector: H_mixed_truncation
    severities: [0.1, 0.5, 0.9]
    max_seq_length: 512
  H_full_swap_minilm:
    injector: H_full_swap
    severities: [1.0]
    alt_model: sentence-transformers/all-MiniLM-L6-v2
    alt_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  H_full_swap_bge:
    injector: H_full_swap
    severities: [1.0]
    alt_model: BAAI/bge-small-en-v1.5
    alt_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  H_query_topic_shift:
    injector: H_query_topic_shift
    severities: [0.1, 0.5, 0.9]
    n_topics: 5
    topic: 0
  # F5 (#101): index built without Normalize, on the F1 grid, and its negative control,
  # questions without Normalize, on the control grid. CLS pooling is left out: its 0.025
  # drop on NFCorpus is below what a 100-question window detects.
  F5_index_no_normalize:
    injector: F5_index_no_normalize
    severities: [0.1, 0.3, 0.5, 0.7, 0.9]
  H_query_no_normalize:
    injector: H_query_no_normalize
    severities: [0.1, 0.5, 0.9]
  # F3 is MLDR-only (configs/dev_mldr.yaml). F4 is out of scope (#13). The combined_scores /
  # two_stage detectors (#102) go in the list below if they merge before the freeze.
# the detectors the full dev run graded (dev_full.yaml)
detectors: [ks_top1, ks_gap, ks_mean10, ks_std10, psi_top1, psi_gap, psi_mean10, psi_std10,
            qpp_max, qpp_nqc, qpp_gap, re_embed, domain_classifier_query, domain_classifier_retrieved_docs]
window_size: 100
# harmful = p < 0.05 and nDCG@10 drop >= min_drop (#52): no negative control comes out
# harmful at 0.02; F2 is reported at 0.01 as well, since most of its damage is below 0.02
min_drop: 0.02
trials: 20
seeds: [0, 1, 2]
