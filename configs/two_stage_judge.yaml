# Two-stage monitor (#74): the LLM judge on a subset of the full dev run's windows.
# Windows depend only on seed, trial and severity, so these are the same windows as
# configs/dev_full.yaml (trials 0-9) and stage-1 scores are joined from that run.
# Seeds 0-2 calibrate the thresholds, seeds 7-9 are the test seeds. NFCorpus only.
# Local model through Ollama, so it costs nothing; judgements are cached.
datasets: [nfcorpus]
model: sentence-transformers/multi-qa-MiniLM-L6-cos-v1
retriever:
  revision: b207367332321f8e44f96e224ef15bc607f4dbf0
  max_seq_length: 256  # title + text truncated at 256 tokens, no chunking (#5)
failures:
  F1_partial_upgrade_minilm:
    injector: F1_partial_upgrade
    severities: [0.3, 0.5, 0.9]
    alt_model: sentence-transformers/all-MiniLM-L6-v2
    alt_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  F1_partial_upgrade_bge:
    injector: F1_partial_upgrade
    severities: [0.1, 0.3, 0.5]
    alt_model: BAAI/bge-small-en-v1.5
    alt_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  F2_distractors_arguana:
    injector: F2_distractors
    severities: [0.1, 0.5, 0.9]
    source: arguana
  H_mixed_truncation_512:
    injector: H_mixed_truncation
    severities: [0.5]
    max_seq_length: 512
  H_full_swap_minilm:
    injector: H_full_swap
    severities: [1.0]
    alt_model: sentence-transformers/all-MiniLM-L6-v2
    alt_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  H_full_swap_bge:
    injector: H_full_swap
    severities: [1.0]
    alt_model: BAAI/bge-small-en-v1.5
    alt_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  H_query_topic_shift:
    injector: H_query_topic_shift
    severities: [0.5, 0.9]
detectors:
  - llm_judge: {live: true}
window_size: 100
trials: 10
seeds: [0, 1, 2, 7, 8, 9]
